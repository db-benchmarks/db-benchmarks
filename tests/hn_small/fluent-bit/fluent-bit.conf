[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/fluent-bit-parsers.conf

[INPUT]
    Name          tail
    Tag           hn_small.json
    Path          /data/data.jsonl
    Read_from_Head true
    Exit_On_Eof   true
    DB            /tmp/fluent-bit-hn_small-json.db
    Mem_Buf_Limit 512MB
    Skip_Long_Lines Off
    Parser        hn_json

[FILTER]
    Name          lua
    Match         hn_small.json
    script        /fluent-bit/etc/parse.lua
    call          normalize_hn_json

[OUTPUT]
    Name          es
    Match         hn_small.json
    Host          __HOST__
    Port          __PORT__
    Index         hn_small
    Logstash_Format Off
    Suppress_Type_Name On
    Id_Key        id
    Write_Operation index
    Pipeline      __PIPELINE__
    Workers       __WORKERS__
    Retry_Limit   False
    Trace_Error   On
    Buffer_Size  False
