[SERVICE]
    Flush         1
    Log_Level     info

[INPUT]
    Name          tail
    Tag           taxi.csv
    Path          /data/trips.csv.*
    Read_from_Head true
    Exit_On_Eof   true
    DB            /tmp/fluent-bit-taxi.db
    Mem_Buf_Limit 512MB
    Skip_Long_Lines Off

[FILTER]
    Name          lua
    Match         taxi.csv
    script        /fluent-bit/etc/parse.lua
    call          __NORMALIZE_FUNCTION__

[OUTPUT]
    Name          es
    Match         taxi.csv
    Host          __HOST__
    Port          __PORT__
    Index         taxi
    Logstash_Format Off
    Suppress_Type_Name On
    Id_Key        __ID_KEY__
    Write_Operation index
    Pipeline      __PIPELINE__
    Workers       __WORKERS__
    Retry_Limit   False
    Trace_Error   On
    Buffer_Size  False
