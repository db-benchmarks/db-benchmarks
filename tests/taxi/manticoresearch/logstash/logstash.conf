input {
    file {
        path => "/data/trips.csv.*"
        start_position => "beginning"
        sincedb_path => "/tmp/since"
        mode => "read"
        exit_after_read => "true"
        file_completed_action => "log"
        file_completed_log_path => "/dev/null"
    }
}

filter {
    csv {
        columns => ["trip_id",
                    "vendor_id",
                    "pickup_datetime",
                    "dropoff_datetime",
                    "store_and_fwd_flag",
                    "rate_code_id",
                    "pickup_longitude",
                    "pickup_latitude",
                    "dropoff_longitude",
                    "dropoff_latitude",
                    "passenger_count",
                    "trip_distance",
                    "fare_amount",
                    "extra",
                    "mta_tax",
                    "tip_amount",
                    "tolls_amount",
                    "ehail_fee",
                    "improvement_surcharge",
                    "total_amount",
                    "payment_type",
                    "trip_type",
                    "pickup",
                    "dropoff",
                    "cab_type",
                    "rain",
                    "snow_depth",
                    "snowfall",
                    "max_temp",
                    "min_temp",
                    "wind",
                    "pickup_nyct2010_gid",
                    "pickup_ctlabel",
                    "pickup_borocode",
                    "pickup_boroname",
                    "pickup_ct2010",
                    "pickup_boroct2010",
                    "pickup_cdeligibil",
                    "pickup_ntacode",
                    "pickup_ntaname",
                    "pickup_puma",
                    "dropoff_nyct2010_gid",
                    "dropoff_ctlabel",
                    "dropoff_borocode",
                    "dropoff_boroname",
                    "dropoff_ct2010",
                    "dropoff_boroct2010",
                    "dropoff_cdeligibil",
                    "dropoff_ntacode",
                    "dropoff_ntaname",
                    "dropoff_puma"]
        separator => ","
        skip_empty_columns => true
    }

    mutate {
        convert => {
            "trip_id"               => "integer"
            "pickup_datetime"       => "integer"
            "dropoff_datetime"      => "integer"
            "rate_code_id"          => "integer"
            "pickup_longitude"      => "float"
            "pickup_latitude"       => "float"
            "dropoff_longitude"     => "float"
            "dropoff_latitude"      => "float"
            "passenger_count"       => "integer"
            "trip_distance"         => "float"
            "fare_amount"           => "float"
            "extra"                 => "float"
            "mta_tax"               => "float"
            "tip_amount"            => "float"
            "tolls_amount"          => "float"
            "ehail_fee"             => "float"
            "improvement_surcharge" => "float"
            "total_amount"          => "float"
            "trip_type"             => "integer"
            "rain"                  => "float"
            "snow_depth"            => "float"
            "snowfall"              => "float"
            "max_temp"              => "integer"
            "min_temp"              => "integer"
            "wind"                  => "float"
            "pickup_nyct2010_gid"   => "integer"
            "pickup_borocode"       => "integer"
            "dropoff_nyct2010_gid"  => "integer"
            "dropoff_borocode"      => "integer"
        }
    }

    mutate {
        add_field => { "[@metadata][id]" => "%{trip_id}" }
        remove_field => ["path", "host", "message", "@version", "@timestamp", "tags", "trip_id", "[event]", "[log]"]
    }
}

output {
    elasticsearch {
        hosts => ["http://manticoresearch:9308"]
        index => "taxi"
        document_id => "%{[@metadata][id]}"
        ilm_enabled => false
        manage_template => false
    }
}
