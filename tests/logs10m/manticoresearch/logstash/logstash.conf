input {
    file {
        codec => multiline {
                pattern => "^\"\d+\",\"\d+\.\d+\.\d+\.\d+\","
                negate => "true"
                what => "previous"
        }
        path => ["/data/data.csv"]
        start_position => "beginning"
        sincedb_path => "/dev/null"
        mode => "read"
        exit_after_read => "true"
        file_completed_action => "log"
        file_completed_log_path => "/dev/null"
    }
}

filter {
    csv {
        separator => ","
        columns => ["id", "remote_addr", "remote_user", "runtime", "time_local", "request_type", "request_path", "request_protocol", "status", "size", "referer", "usearagent"]
    }
    mutate {
        convert => { "id" => "integer" "runtime" => "integer" "time_local" => "integer" "status" => "integer" "size" => "integer" }
    }
    mutate {
        add_field => { "[@metadata][id]" => "%{id}" }
        remove_field => ["path", "host", "message", "@version", "@timestamp", "tags", "id", "[event]", "[log]"]
    }
}

output {
    elasticsearch {
        hosts => ["http://manticoresearch:9308"]
        index => "logs10m"
        document_id => "%{[@metadata][id]}"
        ilm_enabled => false
        manage_template => false
    }
}
