[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/fluent-bit-parsers.conf

[INPUT]
    Name          tail
    Tag           logs10m.json
    Path          /data/data.jsonl
    Read_from_Head true
    Exit_On_Eof   true
    DB            /tmp/fluent-bit-logs10m-json.db
    Mem_Buf_Limit 512MB
    Skip_Long_Lines Off
    Parser        logs10m_json

[FILTER]
    Name          lua
    Match         logs10m.json
    script        /fluent-bit/etc/parse.lua
    call          normalize_logs10m_manticore_json

[OUTPUT]
    Name          es
    Match         logs10m.json
    Host          __HOST__
    Port          __PORT__
    Index         logs10m
    Logstash_Format Off
    Suppress_Type_Name On
    Id_Key        id
    Write_Operation index
    Pipeline      __PIPELINE__
    Workers       __WORKERS__
    Retry_Limit   False
    Trace_Error   On
    Buffer_Size  False
