input {
    file {
        codec => multiline {
                pattern => "^\"\d+\",\"\d+\","
                negate => "true"
                what => "previous"
        }
        path => ["/data/data.csv"]
        start_position => "beginning"
        sincedb_path => "/dev/null"
        mode => "read"
        exit_after_read => "true"
        file_completed_action => "log"
        file_completed_log_path => "/dev/null"
    }
}

filter {
    csv {
        separator => ","
        skip_header => "true"
        columns => [
                "id",
                "story_id",
                "story_text",
                "story_author",
                "comment_id",
                "comment_text",
                "comment_author",
                "comment_ranking",
                "author_comment_count",
                "story_comment_count"
        ]
    }
    mutate {
        convert => {
            "id" => "integer"
            "story_id" => "integer"
            "comment_id" => "integer"
            "comment_ranking" => "integer"
            "author_comment_count" => "integer"
            "story_comment_count" => "integer"
        }
    }
    mutate {
        add_field => { "[@metadata][id]" => "%{id}" }
        remove_field => ["path", "host", "message", "@version", "@timestamp", "tags", "id", "[event]", "[log]"]
    }
}

output {
    elasticsearch {
        hosts => ["http://manticoresearch:9308"]
        index => "hn"
        document_id => "%{[@metadata][id]}"
        ilm_enabled => false
        manage_template => false
    }
}
